<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - HA-Edu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .error-container {
            background: white;
            border-radius: 10px;
            padding: 40px;
            max-width: 600px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        
        .error-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        
        .error-title {
            font-size: 28px;
            color: #333;
            margin-bottom: 15px;
        }
        
        .error-message {
            font-size: 16px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        
        .error-details {
            background: #f7fafc;
            border-left: 4px solid #667eea;
            padding: 15px;
            text-align: left;
            margin-bottom: 25px;
            border-radius: 4px;
        }
        
        .error-details strong {
            color: #333;
        }
        
        .error-suggestions {
            background: #fff5e6;
            border-left: 4px solid #ed8936;
            padding: 15px;
            text-align: left;
            margin-bottom: 25px;
            border-radius: 4px;
        }
        
        .error-suggestions h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 16px;
        }
        
        .error-suggestions ul {
            margin-left: 20px;
            color: #666;
        }
        
        .error-suggestions li {
            margin-bottom: 8px;
        }
        
        .action-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
        }
        
        .btn-secondary {
            background: #e2e8f0;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #cbd5e0;
        }
        
        .status-code {
            display: inline-block;
            background: #fed7d7;
            color: #742a2a;
            padding: 4px 12px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">{{ icon|safe }}</div>
        <div class="status-code">Error {{ status_code }}</div>
        <h1 class="error-title">{{ title }}</h1>
        <p class="error-message">{{ message }}</p>
        
        {% if details %}
        <div class="error-details">
            <strong>Details:</strong> {{ details }}
        </div>
        {% endif %}
        
        {% if suggestions %}
        <div class="error-suggestions">
            <h3>💡 What you can do:</h3>
            <ul>
                {% for suggestion in suggestions %}
                <li>{{ suggestion }}</li>
                {% endfor %}
            </ul>
        </div>
        {% endif %}
        
        <div class="action-buttons">
            <a href="javascript:window.location.reload()" class="btn btn-primary">🔄 Retry</a>
            <a href="/" class="btn btn-secondary">🏠 Back to Portal</a>
        </div>
    </div>
</body>
</html>
