# Master Home Assistant Configuration for HA-Edu
# This configuration enables demo mode and provides sample entities for educational purposes

# Configure a default setup of Home Assistant (frontend, api, etc)
default_config:

# Enable demo mode with predefined entities
# This automatically creates lights, climate, weather, camera, and other demo entities
demo:

# Text to speech
tts:
  - platform: google_translate

# Buttons (2 buttons using input_button helper)
input_button:
  demo_button_1:
    name: "Demo Button 1"
    icon: mdi:button-cursor
  demo_button_2:
    name: "Demo Button 2"
    icon: mdi:button-pointer

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
