version: '3.8'

services:
  ha-edu-portal:
    build: .
    container_name: ha-edu-portal
    ports:
      - "5000:5000"
      # Note: Individual HA instance ports are dynamically assigned and managed by the portal
      # No need to pre-allocate port ranges
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data
      - ./logs:/logs
    environment:
      - BASE_PORT=8124
      - DATA_FILE=/data/instances.json
      - LOG_DIR=/logs
      - LOG_RETENTION_DAYS=90  # GDPR compliance: automatic log cleanup after 90 days
      - HA_IMAGE=ghcr.io/home-assistant/home-assistant:stable
      - MAX_INSTANCES=${MAX_INSTANCES:-0}
      - ONBOARDING_CACHE_TTL=${ONBOARDING_CACHE_TTL:-60}
      - SECRET_KEY=${SECRET_KEY:-}
      # Docker host IP for accessing instance containers
      # Use 'host.docker.internal' on Docker Desktop (Mac/Windows)
      # Use 'localhost' when running portal directly on host (not in Docker)
      # Or set to host's IP address (e.g., 192.168.1.10) if needed
      - DOCKER_HOST_IP=host.docker.internal
    restart: unless-stopped
    networks:
      - ha-edu-network
    # Enable host.docker.internal on Linux
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Network isolation: Portal can access Docker socket to manage containers
    # Created HA containers use bridge network (isolated from host LAN)
    # Internet access via NAT, LAN devices not accessible

networks:
  ha-edu-network:
    driver: bridge
    # Bridge network provides isolation from host LAN while allowing internet access
    # Containers on this network cannot discover devices on the host's LAN
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"
      com.docker.network.driver.mtu: "1500"
