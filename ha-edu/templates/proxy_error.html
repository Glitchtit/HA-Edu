<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - HA-Edu</title>
    <style>
        :root {
            /* Brand Colors - Orange to Pink Gradient Palette */
            --color-primary: oklch(0.65 0.22 35);        /* Vibrant orange */
            --color-secondary: oklch(0.58 0.24 340);     /* Pink/Magenta */
            --color-tertiary: oklch(0.70 0.18 25);       /* Lighter orange accent */
            
            /* Neutral Palette */
            --color-black: oklch(0.20 0.02 265);
            --color-gray-900: oklch(0.25 0.02 265);
            --color-gray-800: oklch(0.35 0.01 265);
            --color-gray-700: oklch(0.45 0.01 265);
            --color-gray-300: oklch(0.90 0.01 265);
            --color-gray-100: oklch(0.96 0.01 265);
            
            /* Semantic Colors */
            --background: oklch(0.98 0.01 265);
            --foreground: oklch(0.20 0.02 265);
            --card: oklch(1.00 0 0);
            --card-foreground: oklch(0.20 0.02 265);
            
            --border: oklch(0.90 0.01 265);
            --shadow-color: oklch(0.65 0.22 35 / 0.15);
            
            --radius: 1rem;
            --radius-sm: 0.5rem;
            --radius-lg: 1.5rem;
        }
        
        @media (prefers-color-scheme: dark) {
            :root {
                --background: oklch(0.20 0.02 265);
                --foreground: oklch(0.98 0.01 265);
                --card: oklch(0.25 0.02 265);
                --card-foreground: oklch(0.98 0.01 265);
                --border: oklch(0.35 0.01 265);
                
                --color-gray-100: oklch(0.30 0.01 265);
                --color-gray-300: oklch(0.40 0.01 265);
                --color-gray-700: oklch(0.70 0.01 265);
            }
            
            .error-details {
                background: oklch(0.28 0.04 35);
            }
            
            .error-suggestions {
                background: oklch(0.28 0.04 40);
            }
            
            .error-suggestions ul {
                color: var(--color-gray-700);
            }
            
            .status-code {
                background: oklch(0.30 0.10 25);
                color: oklch(0.80 0.15 25);
            }
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, 
                var(--color-black) 0%, 
                var(--color-gray-900) 50%, 
                var(--color-black) 100%
            );
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .error-container {
            background: var(--card);
            color: var(--card-foreground);
            border-radius: var(--radius-lg);
            padding: 40px;
            max-width: 600px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
            text-align: center;
        }
        
        .error-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        
        .error-title {
            font-size: 28px;
            color: var(--foreground);
            margin-bottom: 15px;
            font-weight: 700;
        }
        
        .error-message {
            font-size: 16px;
            color: var(--color-gray-700);
            line-height: 1.6;
            margin-bottom: 25px;
        }
        
        .error-details {
            background: oklch(0.96 0.05 35);
            border-left: 4px solid var(--color-primary);
            padding: 15px;
            text-align: left;
            margin-bottom: 25px;
            border-radius: var(--radius-sm);
        }
        
        .error-details strong {
            color: var(--foreground);
        }
        
        .error-suggestions {
            background: oklch(0.94 0.08 40);
            border-left: 4px solid var(--color-tertiary);
            padding: 15px;
            text-align: left;
            margin-bottom: 25px;
            border-radius: var(--radius-sm);
        }
        
        .error-suggestions h3 {
            color: var(--foreground);
            margin-bottom: 10px;
            font-size: 16px;
            font-weight: 600;
        }
        
        .error-suggestions ul {
            margin-left: 20px;
            color: var(--color-gray-700);
        }
        
        .error-suggestions li {
            margin-bottom: 8px;
        }
        
        .action-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: var(--radius);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: linear-gradient(90deg, 
                var(--color-primary) 0%, 
                var(--color-secondary) 50%, 
                var(--color-primary) 100%
            );
            background-size: 200% 100%;
            background-position: 0% 0%;
            color: white;
        }
        
        .btn-primary:hover {
            background-position: 100% 0%;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px var(--shadow-color);
        }
        
        .btn-secondary {
            background: var(--color-gray-100);
            color: var(--foreground);
            border: 1px solid var(--border);
        }
        
        .btn-secondary:hover {
            background: var(--color-gray-300);
        }
        
        .status-code {
            display: inline-block;
            background: oklch(0.90 0.10 25);
            color: oklch(0.35 0.20 25);
            padding: 4px 12px;
            border-radius: var(--radius-sm);
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">{{ icon|safe }}</div>
        <div class="status-code">Error {{ status_code }}</div>
        <h1 class="error-title">{{ title }}</h1>
        <p class="error-message">{{ message }}</p>
        
        {% if details %}
        <div class="error-details">
            <strong>Details:</strong> {{ details }}
        </div>
        {% endif %}
        
        {% if suggestions %}
        <div class="error-suggestions">
            <h3>💡 What you can do:</h3>
            <ul>
                {% for suggestion in suggestions %}
                <li>{{ suggestion }}</li>
                {% endfor %}
            </ul>
        </div>
        {% endif %}
        
        <div class="action-buttons">
            <button onclick="window.location.reload()" class="btn btn-primary">🔄 Retry</button>
            <a href="/" class="btn btn-secondary">🏠 Back to Portal</a>
        </div>
    </div>
</body>
</html>
